name: Smoke Public ePBS Feed

on:
  pull_request:
    paths:
      - ".github/workflows/smoke-public-epbs-feed.yml"
      - "examples/consume-epbs-feed.mjs"
      - "feeds/epbs.json"
      - "docs/feeds/epbs.json"

permissions:
  contents: read

jobs:
  smoke-public-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consume public ePBS feed
        env:
          VORTIK_EPBS_FEED_SOURCE: https://vortikregistry.github.io/vortik-open-schema/feeds/epbs.json
        run: node examples/consume-epbs-feed.mjs
