name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate Vortik Registry"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false

      - name: Identify the source being published
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate the checked-out publication source
        run: |
          npm ci
          npm run check:public-safety
          npm run validate

      - name: Read existing GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Stamp deployment-specific artifact
        shell: bash
        env:
          PUBLICATION_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf '{"commit":"%s","run_id":"%s"}\n' \
            "${PUBLICATION_SHA}" "${GITHUB_RUN_ID}" \
            > docs/pages-deployment.json

      - name: Upload deterministic docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed public artifacts
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLICATION_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"

          for relative_path in \
            pages-deployment.json \
            registry.json \
            market.index.json \
            index.html \
            app.html \
            research.html \
            assets/registry.css \
            assets/registry-explorer.js \
            assets/ethereum-search.js \
            assets/site-analytics.js \
            assets/vortik-mark.svg \
            ethereum-catalog.json \
            ethereum-catalog.schema.json \
            protocol-context.json \
            protocol-context.schema.json \
            market.html \
            feeds/index.json \
            feeds/epbs.json \
            agents/discovery.json \
            verification/requirements.json \
            schemas/agents/vortik-agent-discovery/1.0.0/schema.json \
            schemas/agents/vortik-agent-discovery/1.1.0/schema.json \
            schemas/agents/vortik-agent-discovery/1.2.0/schema.json \
            schemas/agents/vortik-agent-discovery/1.3.0/schema.json \
            schemas/queries/vortik-ens-research-request/1.0.0/schema.json \
            schemas/queries/vortik-ens-research-response/1.0.0/schema.json \
            schemas/queries/vortik-ens-candidate-contribution/1.0.0/schema.json \
            schemas/reviews/vortik-ens-candidate-review/1.0.0/schema.json \
            schemas/verification/vortik-trusted-verification-requirements/1.0.0/schema.json \
            schemas/verification/vortik-trusted-verification-requirements/1.1.0/schema.json \
            schemas/verification/vortik-trusted-verification-requirements/1.2.0/schema.json \
            schemas/verification/vortik-trusted-verification-requirements/1.3.0/schema.json \
            schemas/verification/vortik-verification-claim/1.0.0/schema.json \
            schemas/verification/vortik-admission-intent/1.0.0/schema.json \
            schemas/verification/vortik-trusted-verification-receipt/1.0.0/schema.json \
            schemas/verification/vortik-verification-key-policy/1.0.0/schema.json; do
            output="/tmp/${relative_path//\//_}"
            verified=false

            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location \
                --connect-timeout 5 \
                --max-time 15 \
                -H "Cache-Control: no-cache" \
                "${base_url}/${relative_path}?deployment=${PUBLICATION_SHA}" \
                --output "${output}" \
                && cmp --silent "docs/${relative_path}" "${output}"; then
                verified=true
                break
              fi

              sleep 5
            done

            if [[ "${verified}" != "true" ]]; then
              echo "Published artifact does not match docs/${relative_path}" >&2
              exit 1
            fi
          done
