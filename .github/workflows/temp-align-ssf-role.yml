name: Temporary SSF role alignment

on:
  push:
    branches:
      - fix/align-ssf-generated-role

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/align-ssf-generated-role
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Align SSF registry role and regenerate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'registry.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const entry = data.anchors.find((anchor) => anchor.id === 'ssf');
          if (!entry) throw new Error('Missing ssf registry entry');
          entry.role = 'finality research primitive tracking SSF as a specific same-slot target within the broader Fast Finality research area, with an ENS-to-canonical scope mismatch rather than invalid or displaced terminology';
          fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          NODE
          npm run generate
          npm run validate
      - name: Commit generated alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json anchors.index.json market.index.json maps/ schemas/ anchors/ docs/
          git diff --cached --quiet || git commit -m "fix: align SSF generated role framing"
          git push origin HEAD:fix/align-ssf-generated-role
