name: Validate Vortik Registry

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vortik-registry-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-pages-deployment
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate raw JSON files before generation
        run: node scripts/validate-json-files.mjs

      - name: Validate registry source
        run: node scripts/validate-registry.mjs

      - name: Generate derived registry files
        run: npm run generate

      - name: Run full validation after generation
        run: npm run validate

      - name: Commit validated generated public outputs
        shell: bash
        run: |
          set -euo pipefail
          git add market.index.json docs/index.html docs/market.html docs/market.md docs/market.index.json

          if git diff --cached --quiet; then
            echo "Generated public outputs are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "generate: synchronize neutral public boundary outputs"
          git push origin HEAD:fix/restore-pages-deployment

      - name: Done
        run: echo "🎯 Vortik registry validation and generated-output synchronization completed"
