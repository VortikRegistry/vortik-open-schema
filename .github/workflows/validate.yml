name: Validate Vortik Registry

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vortik-registry-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate raw JSON files before generation
        run: node scripts/validate-json-files.mjs

      - name: Validate registry source
        run: node scripts/validate-registry.mjs

      - name: Generate derived registry files
        run: npm run generate

      - name: Run full validation after generation
        id: full_validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee validation.log

      - name: Upload validation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-safety-diagnostic
          if-no-files-found: error
          retention-days: 1
          path: validation.log

      - name: Fail when full validation failed
        if: steps.full_validation.outcome != 'success'
        run: exit 1

      - name: Verify generated files are committed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Generated files are out of date or generation is not deterministic."
            echo "Run 'npm run generate', review the changes, and commit them in the PR branch."
            git status --short
            git diff --exit-code || true
            exit 1
          fi

      - name: Done
        run: echo "🎯 Vortik registry validation completed without repository writes"
