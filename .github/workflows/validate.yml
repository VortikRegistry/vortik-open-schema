name: Validate Vortik Registry

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vortik-registry-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate raw JSON files before generation
        run: node scripts/validate-json-files.mjs

      - name: Validate registry source
        run: node scripts/validate-registry.mjs

      - name: Generate derived registry files
        run: npm run generate

      - name: Run full validation after generation
        run: npm run validate

      - name: Commit generated updates
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add registry.json
          git add anchors.index.json
          git add market.index.json
          git add maps/
          git add schemas/
          git add anchors/
          git add docs/

          git diff --cached --quiet || git commit -m "generate derived registry files"
          git push

      - name: Done
        run: echo "🎯 Vortik registry validation and generation completed"
