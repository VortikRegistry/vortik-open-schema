name: Temporary Fast Finality sync

on:
  push:
    branches:
      - docs/sync-fastfinality-entry-points

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-fastfinality-entry-points
          fetch-depth: 0
      - name: Update remaining narrative surfaces
        run: |
          node <<'NODE'
          const fs = require('fs');
          const replacements = [
            {
              files: ['anchors/README.md', 'docs/anchors/README.md'],
              from: '- `fastfinality.eth` captures the direction of the concept, but `single-slot finality (SSF)` is the more precise canonical term.',
              to: '- `fastfinality.eth` aligns with the official Fast Finality umbrella research area, while the current `ssf` registry entry retains `single-slot finality (SSF)` as its narrower canonical term.'
            },
            {
              files: ['SEMANTIC-STATUS.md'],
              from: '- `fastfinality.eth` captures the direction of faster finality, but **single-slot finality (SSF)** is the more precise term.',
              to: '- `fastfinality.eth` aligns with the official **Fast Finality** umbrella research area, while **single-slot finality (SSF)** remains the narrower canonical term for registry ID `ssf`.'
            }
          ];

          for (const replacement of replacements) {
            for (const file of replacement.files) {
              const original = fs.readFileSync(file, 'utf8');
              if (!original.includes(replacement.from)) {
                throw new Error(`Expected text not found in ${file}`);
              }
              fs.writeFileSync(file, original.replace(replacement.from, replacement.to));
            }
          }
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anchors/README.md docs/anchors/README.md SEMANTIC-STATUS.md
          git commit -m "docs: sync Fast Finality entry points"
          git push origin HEAD:docs/sync-fastfinality-entry-points
