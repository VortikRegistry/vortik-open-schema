name: Temporary SSF signal sync

on:
  push:
    branches:
      - fix/update-ssf-emerging-signal-framing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-ssf-emerging-signal-framing
          fetch-depth: 0

      - name: Replace stale Fast Finality displacement framing
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'maps/emerging-signals.json',
            'docs/maps/emerging-signals.json'
          ];
          const stale = 'SSF continues to pressure broader fast-finality language.';
          const replacement = 'Fast Finality is the broader research area, while SSF is a specific same-slot target within that surface.';
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(stale)) {
              throw new Error(`Expected stale framing not found in ${file}`);
            }
            fs.writeFileSync(file, source.replaceAll(stale, replacement));
          }
          NODE

      - name: Commit synchronized map correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/emerging-signals.json docs/maps/emerging-signals.json
          git commit -m "fix: align SSF emerging-signal framing"
          git push origin HEAD:fix/update-ssf-emerging-signal-framing
