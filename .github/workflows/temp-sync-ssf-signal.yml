name: Temporary SSF signal sync

on:
  push:
    branches:
      - fix/update-ssf-emerging-signal-framing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-ssf-emerging-signal-framing
          fetch-depth: 0

      - name: Replace stale Fast Finality displacement framing
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'maps/emerging-signals.json',
            'docs/maps/emerging-signals.json'
          ];
          const replacements = new Map([
            [
              'Finality roadmap concept under watch as Fast Finality is the broader research area, while SSF is a specific same-slot target within that surface.',
              'Finality research concept under watch: Fast Finality is the broader research area, while SSF is a specific same-slot target within that surface.'
            ],
            [
              'May pressure fastfinality.eth if SSF becomes the dominant exact term.',
              'Clarifies that fastfinality.eth aligns with the broader Fast Finality area while the registry retains SSF as the canonical term for the specific same-slot target.'
            ],
            [
              'Should remain watchlist-only unless the registry later adds a more exact SSF-aligned anchor.',
              'Should remain interpretive and must not imply that Fast Finality and SSF are exact synonyms or that either is scheduled for deployment.'
            ]
          ]);
          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8');
            for (const [stale, replacement] of replacements) {
              if (!source.includes(stale)) {
                throw new Error(`Expected stale framing not found in ${file}: ${stale}`);
              }
              source = source.replaceAll(stale, replacement);
            }
            fs.writeFileSync(file, source);
          }
          NODE

      - name: Commit synchronized map correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/emerging-signals.json docs/maps/emerging-signals.json
          git commit -m "fix: align SSF emerging-signal framing"
          git push origin HEAD:fix/update-ssf-emerging-signal-framing
