name: Protocol Watch Agent

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate Vortik Registry"]
    branches: [main]
    types: [completed]
  pull_request:
    paths:
      - "scripts/protocol-watch.mjs"
      - "scripts/protocol-watch-notify.mjs"
      - "tests/protocol-watch.test.mjs"
      - "tests/protocol-watch-notify.test.mjs"
      - "config/protocol-watch.json"
      - "protocol-watch/**"
      - ".github/workflows/protocol-watch.yml"

permissions:
  contents: read

concurrency:
  group: vortik-protocol-watch
  cancel-in-progress: false

jobs:
  boundary-tests:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test watcher boundary
        run: node --test tests/protocol-watch.test.mjs tests/protocol-watch-notify.test.mjs

  watch:
    needs: boundary-tests
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect allowlisted protocol sources
        id: watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/protocol-watch.mjs --write-candidate --github-output "$GITHUB_OUTPUT"

      - name: Deliver bounded evidence issue
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/protocol-watch-notify.mjs

      - name: Retain observed evidence in the run summary
        if: always() && steps.watch.outputs.changed == 'true'
        run: cat protocol-watch/report.md >> "$GITHUB_STEP_SUMMARY"
