name: One-shot public boundary cleanup

on:
  push:
    branches:
      - fix/restore-pages-deployment

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[public-boundary-cleanup]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-pages-deployment
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove public commercial policy and harden regression checks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }

          function write(path, content) {
            fs.writeFileSync(path, content);
          }

          function replaceOnce(content, from, to, label) {
            const count = content.split(from).length - 1;
            if (count !== 1) {
              throw new Error(`${label}: expected exactly one match, found ${count}`);
            }
            return content.replace(from, to);
          }

          function replaceRegexOnce(content, pattern, to, label) {
            const matches = content.match(pattern);
            if (!matches || matches.length !== 1) {
              throw new Error(`${label}: expected exactly one regex match, found ${matches?.length ?? 0}`);
            }
            return content.replace(pattern, to);
          }

          {
            const path = 'docs/index.html';
            let content = read(path);
            content = replaceOnce(
              content,
              'High-signal anchors derived from protocol alignment and semantic convergence. This is not a marketplace. It is a registry view reflecting where Ethereum’s coordination language appears to be narrowing first. Strategic acquisition inquiries may be reviewed case by case. No public pricing is provided.',
              'High-signal anchors derived from protocol alignment and semantic convergence. This is not a marketplace. It is a registry view reflecting where Ethereum’s coordination language appears to be narrowing first.',
              path
            );
            write(path, content);
          }

          {
            const path = 'scripts/generate-market-index.mjs';
            let content = read(path);
            content = replaceRegexOnce(
              content,
              /const publicInquiryPolicy = \{[\s\S]*?\};\n\n/,
              '',
              `${path}: policy constant`
            );
            content = replaceOnce(content, '  index_version: "1.0.1",', '  index_version: "1.1.0",', `${path}: version`);
            content = replaceOnce(content, '  public_inquiry_policy: publicInquiryPolicy,\n', '', `${path}: policy field`);
            content = replaceOnce(
              content,
              'console.log("✅ public_inquiry_policy added for controlled strategic inquiries");\n',
              'console.log("✅ strategic index contains technical registry metadata only");\n',
              `${path}: success message`
            );
            write(path, content);
          }

          {
            const path = 'scripts/generate-market-doc.mjs';
            let content = read(path);
            content = replaceRegexOnce(
              content,
              /It is a public registry view, not an official protocol specification and not a market-price document\.\n\nStrategic acquisition inquiries may be reviewed case by case\.\nNo public pricing is provided\.\nTransfer decisions are evaluated privately\.\nThis registry is not an auction or public price list\.\n\n---\n\n## Public inquiry policy\n\n- Inquiry status: \$\{normalizeText\(market\.public_inquiry_policy\?\.inquiry_status\)\}\n- Pricing policy: \$\{normalizeText\(market\.public_inquiry_policy\?\.pricing_policy\)\}\n- Transfer policy: \$\{normalizeText\(market\.public_inquiry_policy\?\.transfer_policy\)\}\n- Contact note: \$\{normalizeText\(market\.public_inquiry_policy\?\.public_contact_note\)\}\n\n---/,
              'It is a public registry view, not an official protocol specification.\n\nThe document reports technical priority, visibility, classification, status, stage and type only.\n\n---',
              `${path}: public policy section`
            );
            write(path, content);
          }

          {
            const path = 'scripts/generate-market-html.mjs';
            let content = read(path);
            content = replaceRegexOnce(
              content,
              /const publicInquiryPolicy = \{[\s\S]*?\};\n\n/,
              '',
              `${path}: policy constant`
            );
            content = replaceOnce(
              content,
              `        <div class="card-footer">\n          <span class="badge badge-inquiry">\${publicInquiryPolicy.inquiryStatus}</span>\n          <span class="card-note">\${publicInquiryPolicy.transferPolicy}</span>\n        </div>`,
              `        <div class="card-footer">\n          <span class="badge">\${escapeHtml(anchor.classification)}</span>\n          <span class="card-note">\${escapeHtml(anchor.status_label || anchor.status)}</span>\n        </div>`,
              `${path}: card footer`
            );
            content = replaceOnce(
              content,
              `      This page is a public registry view for technical alignment, stewardship context and infrastructure relevance.\n      Strategic acquisition inquiries may be reviewed case by case. No public pricing is provided.`,
              `      This page is a public registry view for technical alignment, stewardship context and infrastructure relevance.`,
              `${path}: hero copy`
            );
            content = replaceOnce(
              content,
              `      <a class="btn-primary" href="https://x.com/VortikRegistry" target="_blank" rel="noopener noreferrer">\n        ↗ Request technical alignment discussion via X\n      </a>\n      <a class="btn-secondary" href="./index.html">\n        View registry\n      </a>`,
              `      <a class="btn-primary" href="./index.html">\n        View registry\n      </a>\n      <a class="btn-secondary" href="https://github.com/VortikRegistry/vortik-open-schema" target="_blank" rel="noopener noreferrer">\n        View public repository\n      </a>`,
              `${path}: hero actions`
            );
            content = replaceOnce(
              content,
              `      <h3>Technical alignment discussion</h3>\n      <p>\n        Vortik operates as an independent semantic registry.\n        Strategic acquisition inquiries may be reviewed case by case.\n        No public pricing is provided. Transfer decisions are evaluated privately.\n        This registry is not an auction or public price list.\n      </p>`,
              `      <h3>Technical registry context</h3>\n      <p>\n        Vortik operates as an independent semantic registry.\n        This view presents technical alignment, status and provenance for indexed coordination anchors.\n      </p>`,
              `${path}: final section copy`
            );
            content = replaceOnce(
              content,
              `      <a class="btn-primary" href="https://x.com/VortikRegistry" target="_blank" rel="noopener noreferrer">\n        ↗ Request technical alignment discussion via X\n      </a>`,
              `      <a class="btn-primary" href="https://github.com/VortikRegistry/vortik-open-schema" target="_blank" rel="noopener noreferrer">\n        View public repository\n      </a>`,
              `${path}: final section action`
            );
            write(path, content);
          }

          {
            const path = 'scripts/check-public-safety.mjs';
            let content = read(path);
            content = replaceOnce(
              content,
              `  { concept: 'sales pitch', reason: 'sales pitch belongs outside public registry data' },\n];`,
              `  { concept: 'sales pitch', reason: 'sales pitch belongs outside public registry data' },\n  { concept: 'acquisition inquiry', reason: 'acquisition inquiries belong outside public registry data' },\n  { concept: 'acquisition inquiries', reason: 'acquisition inquiries belong outside public registry data' },\n  { concept: 'qualified acquisition inquiry', reason: 'acquisition inquiries belong outside public registry data' },\n  { concept: 'qualified acquisition inquiries', reason: 'acquisition inquiries belong outside public registry data' },\n  { concept: 'strategic inquiries reviewed', reason: 'commercial inquiry status belongs outside public registry data' },\n  { concept: 'private case by case review', reason: 'private commercial review belongs outside public registry data' },\n  { concept: 'transfer decisions', reason: 'transfer intent belongs outside public registry data' },\n  { concept: 'sale inquiry', reason: 'sale inquiries belong outside public registry data' },\n  { concept: 'sale inquiries', reason: 'sale inquiries belong outside public registry data' },\n  { concept: 'for sale', reason: 'availability belongs outside public registry data' },\n  { concept: 'price disclosed privately', reason: 'private pricing belongs outside public registry data' },\n  { concept: 'public inquiry policy', reason: 'commercial inquiry policy belongs outside public registry data' },\n];`,
              `${path}: blocked concepts`
            );

            content = replaceOnce(
              content,
              `const files = [...new Set(SCAN_TARGETS.flatMap(collectFiles))].sort();`,
              `function unsafeMatches(line) {\n  return MATCHERS.filter((matcher) => matcher.regex.test(line) && !isPolicyOrTechnicalSafe(line, matcher.concept));\n}\n\nconst UNSAFE_REGRESSION_SAMPLES = [\n  'Strategic acquisition inquiries may be reviewed case by case.',\n  'Available for qualified acquisition inquiry.',\n  'Strategic inquiries reviewed.',\n  'Private case-by-case review.',\n  'Transfer decisions are evaluated privately.',\n  'This name is for sale.',\n  'Price disclosed privately.'\n];\n\nfor (const sample of UNSAFE_REGRESSION_SAMPLES) {\n  if (unsafeMatches(sample).length === 0) {\n    throw new Error(\`Public safety regression failed to reject: \${sample}\`);\n  }\n}\n\nconst SAFE_REGRESSION_SAMPLES = [\n  'The public registry must not contain acquisition inquiries.',\n  'Transfer decisions belong outside public registry data.',\n  'Do not describe an ENS name as for sale in public registry data.'\n];\n\nfor (const sample of SAFE_REGRESSION_SAMPLES) {\n  if (unsafeMatches(sample).length !== 0) {\n    throw new Error(\`Public safety regression rejected policy language: \${sample}\`);\n  }\n}\n\nconst files = [...new Set(SCAN_TARGETS.flatMap(collectFiles))].sort();`,
              `${path}: regression self-check`
            );
            write(path, content);
          }
          NODE

      - name: Regenerate synchronized public outputs
        run: npm run generate

      - name: Validate complete registry and public boundary
        run: npm run validate

      - name: Commit cleanup to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ market.index.json scripts/

          if git diff --cached --quiet; then
            echo "No cleanup changes were produced." >&2
            exit 1
          fi

          git commit -m "[public-boundary-cleanup] remove public commercial policy"
          git push origin HEAD:fix/restore-pages-deployment
